<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0c0f">
<style>
:root{--bg:#0a0c0f;--tile:#14181e;--tile2:#1b222b;--line:#242c36;--text:#eef2f6;--dim:#8793a3;--accent:#ffb454;--late:#ff6b5e;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none!important;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;overflow:hidden;}
#app{height:100%;padding:16px;}
.grid{display:grid;gap:14px;height:100%;
  grid-template-columns:1fr 1fr;
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"clock oev" "weather oev" "scenes pomo";}
@media (orientation:portrait){
  .grid{grid-template-columns:1fr;
    grid-template-rows:auto auto minmax(0,1fr) auto auto;
    grid-template-areas:"clock" "weather" "oev" "scenes" "pomo";}
}
.tile{background:var(--tile);border:1px solid var(--line);border-radius:22px;padding:16px 20px;min-height:0;overflow:hidden;position:relative;}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.label .upd{letter-spacing:0;text-transform:none;font-size:12px;}

/* Uhr */
.time{font-size:17vmin;font-weight:200;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.date{font-size:22px;color:var(--dim);margin-top:6px;}
.pill{margin-top:12px;appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--tile2);color:var(--accent);border-radius:999px;padding:8px 16px;font-size:15px;font-family:inherit;}

/* Wetter */
.wx-main{display:flex;align-items:center;gap:16px;}
.wx-icon{font-size:64px;line-height:1;}
.wx-temp{font-size:58px;font-weight:300;line-height:1;}
.wx-text{font-size:18px;color:var(--dim);margin-top:4px;}
.wx-side{margin-left:auto;text-align:right;font-size:18px;line-height:1.5;color:var(--text);}
.hours{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
.hour{text-align:center;flex:1;}
.hour .h{font-size:14px;color:var(--dim);}
.hour .i{font-size:28px;margin:4px 0;}
.hour .t{font-size:18px;}
.hour .p{font-size:13px;color:#6db7ff;height:16px;}

/* ÖV */
#oevTile{display:flex;flex-direction:column;}
.stopname{appearance:none;-webkit-appearance:none;border:0;background:none;color:var(--text);font-family:inherit;font-size:22px;font-weight:600;padding:0;text-align:left;margin-bottom:10px;}
.stopname.multi::after{content:" ⇄";color:var(--dim);font-weight:400;}
#board{flex:1;min-height:0;overflow:hidden;}
.dep{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:22px;}
.dep:first-child{border-top:0;}
.dep-t{width:78px;font-variant-numeric:tabular-nums;font-weight:600;}
.late{color:var(--late);font-size:15px;font-weight:600;margin-left:4px;}
.chip{min-width:52px;text-align:center;background:var(--accent);color:#1a1205;font-weight:700;border-radius:9px;padding:3px 8px;font-size:18px;}
.dep-to{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dep-in{color:var(--dim);font-size:18px;white-space:nowrap;}
.dep-in.soon{color:var(--accent);font-weight:600;}
.msg{color:var(--dim);font-size:18px;line-height:1.5;padding:12px 0;}

/* Szenen */
.scenes{display:flex;gap:12px;}
a.scene{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;height:92px;border-radius:20px;background:var(--tile2);
  border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:24px;font-weight:600;}
a.scene:active,a.scene.sent{background:var(--accent);color:#1a1205;}
a.scene .ic{font-size:32px;}

/* Pomodoro */
.pomo-row{display:flex;align-items:center;gap:14px;}
.pomo-time{font-size:56px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1;}
.pomo-btns{margin-left:auto;display:flex;gap:8px;}
.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:14px;background:var(--tile2);color:var(--text);font-family:inherit;font-size:17px;padding:12px 16px;}
.btn.main{background:var(--accent);color:#1a1205;border-color:var(--accent);font-weight:600;}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden;}
.bar>div{height:100%;width:0;background:var(--accent);}
.tile.flash{animation:fl 1s steps(2,end) infinite;}
@keyframes fl{0%{background:var(--tile)}50%{background:#4a3410}100%{background:var(--tile)}}

/* Nacht */
#night{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:999;display:block;}
</style>
</head>
<body>
<div id="app">
  <div class="grid">
    <section class="tile" style="grid-area:clock">
      <div id="time" class="time">--:--</div>
      <div id="date" class="date">&nbsp;</div>
      <button id="stayAwake" class="pill" hidden>🌙 Nachtmodus – 10 min wach bleiben</button>
    </section>

    <section class="tile" id="wxTile" style="grid-area:weather">
      <div class="label"><span id="wxPlace">Wetter</span><span class="upd" id="wxUpd"></span></div>
      <div id="wx"><div class="msg">Lade Wetter …</div></div>
    </section>

    <section class="tile" id="oevTile" style="grid-area:oev">
      <div class="label"><span>Abfahrten</span><span class="upd" id="boardUpd"></span></div>
      <button class="stopname" id="stopName">Haltestelle wird gesucht …</button>
      <div id="board"></div>
    </section>

    <section class="tile" style="grid-area:scenes">
      <div class="label"><span>Szenen</span></div>
      <div class="scenes" id="scenes"></div>
    </section>

    <section class="tile" id="pomoTile" style="grid-area:pomo">
      <div class="label"><span>Timer · <span id="pomoMode">Fokus</span></span></div>
      <div class="pomo-row">
        <div class="pomo-time" id="pomoTime">25:00</div>
        <div class="pomo-btns">
          <button class="btn main" id="pomoStart">Start</button>
          <button class="btn" id="pomoReset">Reset</button>
          <button class="btn" id="pomoSwitch">⇄</button>
        </div>
      </div>
      <div class="bar"><div id="pomoBar"></div></div>
    </section>
  </div>
</div>
<div id="night" hidden></div>

<script>
(function(){
"use strict";

/* ====== EINSTELLUNGEN – hier anpassen ====== */
var CONFIG = {
  ort: "Römerswil LU",
  lat: 47.19, lon: 8.21,                       // Näherungswerte, fürs Wetter genau genug
  haltestelleSuche: ["Gosperdingen", "Römerswil"], // Suchbegriffe für die Haltestelle
  haltestelleId: "",                           // optional: feste Haltestellen-ID (überschreibt die Suche)
  haltestelleName: "",
  abfahrten: 6,                                // Anzahl angezeigter Abfahrten
  szenen: [                                    // kurzbefehl = exakter Name des Kurzbefehls auf dem iPad
    { name: "Arbeiten",    kurzbefehl: "Arbeiten",    icon: "💡", nachtAus: false },
    { name: "Einschlafen", kurzbefehl: "Einschlafen", icon: "🌙", nachtAus: true  }
  ],
  nachtVon: "23:00", nachtBis: "06:00",        // in dieser Zeit ist der Bildschirm schwarz
  kurzWachSek: 30,                             // Antippen in der Nacht: so lange sichtbar
  langWachMin: 10,                             // Knopf «wach bleiben»
  mitRueckkehr: true                           // nach dem Kurzbefehl zurück zur Seite springen
};
/* =========================================== */

var TRANSPORT = "https://transport.opendata.ch/v1";
var DAYS = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
var MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
var DUR = { fokus: 25*60000, pause: 5*60000 };

var state = { stops:null, stopsErr:false, stopIdx:0, board:null, boardAt:0, boardErr:false,
              weather:null, weatherAt:0, weatherErr:false, forcedUntil:0, wakeUntil:0 };
var pomo = { mode:"fokus", running:false, endAt:0, left:DUR.fokus, flashUntil:0 };
var tickN = 0;

function $(id){ return document.getElementById(id); }
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function sGet(k){ try { return window.localStorage.getItem("gd." + k); } catch(e){ return null; } }
function sSet(k, v){ try { window.localStorage.setItem("gd." + k, v); } catch(e){} }
function hm(s){ var p = s.split(":"); return parseInt(p[0],10) * 60 + parseInt(p[1],10); }

function getJSON(url, ms){
  return new Promise(function(resolve, reject){
    var ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctl) { ctl.abort(); } reject(new Error("timeout")); }, ms || 12000);
    fetch(url, ctl ? { signal: ctl.signal } : {}).then(function(r){
      if (!r.ok) { throw new Error("HTTP " + r.status); }
      return r.json();
    }).then(function(j){ clearTimeout(timer); resolve(j); })
      .catch(function(e){ clearTimeout(timer); reject(e); });
  });
}

/* ---------- Wetter ---------- */
var WX = {
  0:["Klar","☀️","🌙"], 1:["Überwiegend klar","🌤️","🌙"], 2:["Teilweise bewölkt","⛅","☁️"], 3:["Bedeckt","☁️"],
  45:["Nebel","🌫️"], 48:["Reifnebel","🌫️"],
  51:["Leichter Niesel","🌦️","🌧️"], 53:["Niesel","🌦️","🌧️"], 55:["Starker Niesel","🌧️"],
  56:["Gefrierender Niesel","🌧️"], 57:["Gefrierender Niesel","🌧️"],
  61:["Leichter Regen","🌦️","🌧️"], 63:["Regen","🌧️"], 65:["Starker Regen","🌧️"],
  66:["Gefrierender Regen","🌧️"], 67:["Gefrierender Regen","🌧️"],
  71:["Leichter Schneefall","🌨️"], 73:["Schneefall","🌨️"], 75:["Starker Schneefall","❄️"], 77:["Schneegriesel","🌨️"],
  80:["Leichte Schauer","🌦️","🌧️"], 81:["Schauer","🌧️"], 82:["Heftige Schauer","⛈️"],
  85:["Schneeschauer","🌨️"], 86:["Starke Schneeschauer","🌨️"],
  95:["Gewitter","⛈️"], 96:["Gewitter mit Hagel","⛈️"], 99:["Starkes Gewitter mit Hagel","⛈️"]
};
function wx(code, isDay){
  var e = WX[code] || ["–","❓"];
  return { text: e[0], icon: (isDay === 0 && e[2]) ? e[2] : e[1] };
}

function loadWeather(){
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + CONFIG.lat + "&longitude=" + CONFIG.lon +
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day" +
    "&hourly=temperature_2m,precipitation_probability,weather_code,is_day" +
    "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&timezone=Europe%2FZurich&forecast_days=2&wind_speed_unit=kmh";
  return getJSON(url).then(function(d){
    state.weather = d; state.weatherAt = Date.now(); state.weatherErr = false; renderWeather();
  }).catch(function(){ state.weatherErr = true; renderWeather(); });
}

function renderWeather(){
  var el = $("wx");
  $("wxPlace").textContent = CONFIG.ort;
  var d = state.weather;
  if (!d || !d.current) {
    el.innerHTML = '<div class="msg">' + (state.weatherErr ? "Wetter nicht erreichbar. Neuer Versuch läuft …" : "Lade Wetter …") + "</div>";
    return;
  }
  var c = d.current, w = wx(c.weather_code, c.is_day);
  var hi = d.daily && d.daily.temperature_2m_max ? Math.round(d.daily.temperature_2m_max[0]) : "–";
  var lo = d.daily && d.daily.temperature_2m_min ? Math.round(d.daily.temperature_2m_min[0]) : "–";
  var pp = d.daily && d.daily.precipitation_probability_max ? d.daily.precipitation_probability_max[0] : null;
  var html = '<div class="wx-main"><div class="wx-icon">' + w.icon + '</div><div>' +
    '<div class="wx-temp">' + Math.round(c.temperature_2m) + '°</div>' +
    '<div class="wx-text">' + esc(w.text) + " · gefühlt " + Math.round(c.apparent_temperature) + '°</div></div>' +
    '<div class="wx-side">↑ ' + hi + '° &nbsp;↓ ' + lo + '°<br>💨 ' + Math.round(c.wind_speed_10m) + ' km/h' +
    (pp != null ? '<br>☔ ' + pp + ' %' : "") + '</div></div>';

  var h = d.hourly, hoursHtml = "";
  if (h && h.time) {
    var nowKey = String(c.time).substr(0, 13), idx = 0, i;
    for (i = 0; i < h.time.length; i++) { if (h.time[i].substr(0, 13) >= nowKey) { idx = i; break; } }
    for (i = idx + 1; i <= idx + 6 && i < h.time.length; i++) {
      var hw = wx(h.weather_code[i], h.is_day ? h.is_day[i] : 1);
      var pr = h.precipitation_probability ? h.precipitation_probability[i] : 0;
      hoursHtml += '<div class="hour"><div class="h">' + h.time[i].substr(11, 2) + ' Uhr</div><div class="i">' + hw.icon +
        '</div><div class="t">' + Math.round(h.temperature_2m[i]) + '°</div><div class="p">' + (pr >= 20 ? pr + " %" : "") + '</div></div>';
    }
  }
  el.innerHTML = html + (hoursHtml ? '<div class="hours">' + hoursHtml + "</div>" : "");
  var t = new Date(state.weatherAt);
  $("wxUpd").textContent = state.weatherErr ? "veraltet" : pad(t.getHours()) + ":" + pad(t.getMinutes());
}

/* ---------- Fahrplan ---------- */
function parseTime(s){
  if (!s) { return null; }
  var d = new Date(String(s).replace(/([+-]\d\d)(\d\d)$/, "$1:$2"));   // Safari braucht +01:00
  return isNaN(d.getTime()) ? null : d;
}

async function resolveStops(){
  if (CONFIG.haltestelleId) { return [{ id: CONFIG.haltestelleId, name: CONFIG.haltestelleName || CONFIG.haltestelleId }]; }
  var found = [], seen = {}, anyOk = false, i;
  for (i = 0; i < CONFIG.haltestelleSuche.length; i++) {
    try {
      var d = await getJSON(TRANSPORT + "/locations?type=station&query=" + encodeURIComponent(CONFIG.haltestelleSuche[i]));
      anyOk = true;
      (d.stations || []).forEach(function(s){
        if (s && s.id && !seen[s.id]) { seen[s.id] = 1; found.push({ id: s.id, name: s.name || s.id }); }
      });
    } catch(e) { /* nächster Suchbegriff */ }
  }
  if (!anyOk) { throw new Error("offline"); }
  function score(n){ return /gosperd/i.test(n) ? 2 : (/r(ö|oe)merswil/i.test(n) ? 1 : 0); }
  var scored = found.filter(function(s){ return score(s.name) > 0; });
  var list = scored.length ? scored : found;
  list.sort(function(a, b){ return score(b.name) - score(a.name); });
  return list.slice(0, 6);
}

async function loadBoard(){
  try {
    if (!state.stops) {
      state.stops = await resolveStops();
      state.stopsErr = false;
      var saved = sGet("stopId"), k;
      state.stopIdx = 0;
      for (k = 0; k < state.stops.length; k++) { if (state.stops[k].id === saved) { state.stopIdx = k; } }
    }
    var stop = state.stops[state.stopIdx];
    if (!stop) { state.board = null; renderBoard(); return; }
    var d = await getJSON(TRANSPORT + "/stationboard?id=" + encodeURIComponent(stop.id) + "&limit=12");
    state.board = d.stationboard || [];
    state.boardAt = Date.now(); state.boardErr = false;
  } catch(e) {
    if (!state.stops) { state.stopsErr = true; } else { state.boardErr = true; }
  }
  renderBoard();
}

function cycleStop(){
  if (!state.stops || state.stops.length < 2) { return; }
  state.stopIdx = (state.stopIdx + 1) % state.stops.length;
  sSet("stopId", state.stops[state.stopIdx].id);
  state.board = null; renderBoard(); loadBoard();
}

function lineLabel(e){
  var cat = e.category || "", num = e.number || "";
  if (/^(B|BUS|NFB|T|NFT|TRAM)$/i.test(cat)) { return num || cat; }
  return (cat + " " + num).replace(/^\s+|\s+$/g, "");
}

function renderBoard(){
  var el = $("board"), stop = state.stops && state.stops[state.stopIdx];
  var nameEl = $("stopName");
  nameEl.textContent = stop ? stop.name : "Haltestelle wird gesucht …";
  nameEl.className = "stopname" + (state.stops && state.stops.length > 1 ? " multi" : "");
  if (!state.stops) {
    el.innerHTML = '<div class="msg">' + (state.stopsErr ? "Fahrplan nicht erreichbar. Neuer Versuch läuft …" : "Suche Haltestelle …") + "</div>";
    return;
  }
  if (!state.stops.length) {
    el.innerHTML = '<div class="msg">Keine Haltestelle gefunden. Suchbegriffe oben in der Datei (CONFIG) anpassen.</div>';
    return;
  }
  if (!state.board) { el.innerHTML = '<div class="msg">Lade Abfahrten …</div>'; return; }
  var now = Date.now(), html = "", n = 0, i;
  for (i = 0; i < state.board.length && n < CONFIG.abfahrten; i++) {
    var e = state.board[i], st = e.stop || {};
    var planned = st.departure, real = parseTime((st.prognosis && st.prognosis.departure) || planned);
    var mins = real ? Math.round((real.getTime() - now) / 60000) : null;
    if (mins !== null && mins < 0) { continue; }
    var label = mins === null ? "" : (mins <= 0 ? "jetzt" : (mins < 60 ? "in " + mins + " min" : ""));
    var late = (typeof st.delay === "number" && st.delay > 0) ? '<span class="late">+' + st.delay + "</span>" : "";
    html += '<div class="dep"><div class="dep-t">' + (planned ? esc(String(planned).substr(11, 5)) : "--:--") + late + '</div>' +
      '<div class="chip">' + esc(lineLabel(e)) + '</div><div class="dep-to">' + esc(e.to) + '</div>' +
      '<div class="dep-in' + (mins !== null && mins <= 3 ? " soon" : "") + '">' + label + "</div></div>";
    n++;
  }
  el.innerHTML = html || '<div class="msg">Keine Abfahrten in nächster Zeit.</div>';
  var t = new Date(state.boardAt);
  $("boardUpd").textContent = state.boardErr ? "veraltet" : pad(t.getHours()) + ":" + pad(t.getMinutes());
}

/* ---------- Szenen ---------- */
function baseUrl(){ return location.href.split("#")[0]; }
function buildScenes(){
  var box = $("scenes"); box.innerHTML = "";
  CONFIG.szenen.forEach(function(s){
    var a = document.createElement("a");
    a.className = "scene";
    var back = baseUrl() + (s.nachtAus ? "#einschlafen" : "");
    var href = CONFIG.mitRueckkehr
      ? "shortcuts://x-callback-url/run-shortcut?name=" + encodeURIComponent(s.kurzbefehl) +
        "&x-success=" + encodeURIComponent(back) + "&x-cancel=" + encodeURIComponent(back) + "&x-error=" + encodeURIComponent(back)
      : "shortcuts://run-shortcut?name=" + encodeURIComponent(s.kurzbefehl);
    a.setAttribute("href", href);
    a.innerHTML = '<span class="ic">' + s.icon + "</span><span>" + esc(s.name) + "</span>";
    a.addEventListener("click", function(){
      a.className = "scene sent";
      setTimeout(function(){ a.className = "scene"; }, 1500);
      if (s.nachtAus) { forceNight(); }
    });
    box.appendChild(a);
  });
}

/* ---------- Nachtmodus ---------- */
function nextOccurrence(hhmm){
  var m = hm(hhmm), d = new Date();
  d.setHours(Math.floor(m / 60), m % 60, 0, 0);
  if (d.getTime() <= Date.now()) { d.setDate(d.getDate() + 1); }
  return d.getTime();
}
function forceNight(){
  state.forcedUntil = nextOccurrence(CONFIG.nachtBis);
  state.wakeUntil = 0;
  sSet("forced", String(state.forcedUntil));
  tick();
}
function inWindow(d){
  var m = d.getHours() * 60 + d.getMinutes(), a = hm(CONFIG.nachtVon), b = hm(CONFIG.nachtBis);
  return a < b ? (m >= a && m < b) : (m >= a || m < b);
}
function nightState(nowMs){
  if (state.forcedUntil && state.forcedUntil <= nowMs) { state.forcedUntil = 0; sSet("forced", "0"); }
  var armed = inWindow(new Date(nowMs)) || state.forcedUntil > nowMs;
  return { armed: armed, dark: armed && state.wakeUntil <= nowMs };
}

/* ---------- Timer ---------- */
function pomoStartPause(){
  if (pomo.running) { pomo.left = Math.max(0, pomo.endAt - Date.now()); pomo.running = false; }
  else { pomo.endAt = Date.now() + pomo.left; pomo.running = true; pomo.flashUntil = 0; }
  renderPomo();
}
function pomoReset(){ pomo.running = false; pomo.left = DUR[pomo.mode]; pomo.flashUntil = 0; renderPomo(); }
function pomoSwitch(){ pomo.mode = pomo.mode === "fokus" ? "pause" : "fokus"; pomoReset(); }
function renderPomo(){
  var now = Date.now();
  var left = pomo.running ? Math.max(0, pomo.endAt - now) : pomo.left;
  var s = Math.ceil(left / 1000);
  $("pomoTime").textContent = pad(Math.floor(s / 60)) + ":" + pad(s % 60);
  $("pomoMode").textContent = pomo.mode === "fokus" ? "Fokus" : "Pause";
  $("pomoStart").textContent = pomo.running ? "Pause" : "Start";
  $("pomoBar").style.width = Math.round((1 - left / DUR[pomo.mode]) * 100) + "%";
  $("pomoTile").className = "tile" + (now < pomo.flashUntil ? " flash" : "");
}

/* ---------- Takt ---------- */
function tick(){
  var now = new Date(), nowMs = now.getTime();
  $("time").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
  $("date").textContent = DAYS[now.getDay()] + ", " + now.getDate() + ". " + MONTHS[now.getMonth()];

  if (pomo.running && pomo.endAt <= nowMs) {
    pomo.running = false;
    pomo.mode = pomo.mode === "fokus" ? "pause" : "fokus";
    pomo.left = DUR[pomo.mode];
    pomo.flashUntil = nowMs + 8000;
  }
  renderPomo();

  var ns = nightState(nowMs);
  $("night").hidden = !ns.dark;
  $("stayAwake").hidden = !ns.armed;

  tickN++;
  if (tickN % 10 === 0) { renderBoard(); }
}

function init(){
  buildScenes();
  renderWeather(); renderBoard(); renderPomo();

  var f = parseInt(sGet("forced") || "0", 10);
  if (f > Date.now()) { state.forcedUntil = f; }
  if (location.hash === "#einschlafen") {
    forceNight();
    try { history.replaceState(null, "", baseUrl()); } catch(e) {}
  }

  $("night").addEventListener("click", function(){ state.wakeUntil = Date.now() + CONFIG.kurzWachSek * 1000; tick(); });
  $("stayAwake").addEventListener("click", function(){ state.wakeUntil = Date.now() + CONFIG.langWachMin * 60000; tick(); });
  $("stopName").addEventListener("click", cycleStop);
  $("pomoStart").addEventListener("click", pomoStartPause);
  $("pomoReset").addEventListener("click", pomoReset);
  $("pomoSwitch").addEventListener("click", pomoSwitch);

  tick();
  setInterval(tick, 1000);

  loadWeather(); loadBoard();
  setInterval(loadWeather, 15 * 60000);
  setInterval(loadBoard, 30000);
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) { loadWeather(); loadBoard(); tick(); }
  });
}

if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", init); } else { init(); }
})();
</script>
</body>
</html>
